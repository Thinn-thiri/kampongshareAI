<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112">
  <!-- Pinny, KampongShare's noticeboard pin, looking around for something (empty states and the 404 page; fixed light palette: it's an image) -->
  <ellipse cx="52" cy="106" rx="20" ry="4" fill="#2B211B" opacity="0.12"/>
  <!-- the needle -->
  <path d="M52 76 L52 104" stroke="#8A7967" stroke-width="4" stroke-linecap="round"/>
  <!-- the pin's collar -->
  <path d="M34 70 Q52 82 70 70 L66 78 Q52 86 38 78 Z" fill="#C99400"/>
  <!-- the head, tilted a little as it looks -->
  <g transform="rotate(-8 52 42)">
    <circle cx="52" cy="42" r="32" fill="#F2B705"/>
    <circle cx="52" cy="42" r="32" fill="none" stroke="#C99400" stroke-width="3"/>
    <ellipse cx="40" cy="26" rx="9" ry="5" fill="#FFFDF7" opacity="0.55" transform="rotate(-25 40 26)"/>
    <!-- face: eyes glancing to the side, a small curious mouth -->
    <circle cx="42" cy="40" r="5" fill="#FFFDF7"/>
    <circle cx="62" cy="40" r="5" fill="#FFFDF7"/>
    <circle cx="44.5" cy="40" r="2.6" fill="#2B211B"/>
    <circle cx="64.5" cy="40" r="2.6" fill="#2B211B"/>
    <circle cx="35" cy="50" r="4" fill="#F7A072" opacity="0.8"/>
    <circle cx="69" cy="50" r="4" fill="#F7A072" opacity="0.8"/>
    <ellipse cx="54" cy="53" rx="3.5" ry="3" fill="none" stroke="#2B211B" stroke-width="2.5"/>
  </g>
  <!-- one arm shading its eyes, the other on its side -->
  <path d="M80 50 q10 -10 4 -22" fill="none" stroke="#C99400" stroke-width="4" stroke-linecap="round"/>
  <path d="M82 27 q-8 -3 -16 2" fill="none" stroke="#C99400" stroke-width="4" stroke-linecap="round"/>
  <path d="M24 54 q-6 8 2 14" fill="none" stroke="#C99400" stroke-width="4" stroke-linecap="round"/>
  <!-- a little question mark -->
  <path d="M94 12 q0 -7 7 -7 q7 0 7 6 q0 5 -6 7 l0 4" fill="none" stroke="#1E6B47" stroke-width="3" stroke-linecap="round"/>
  <circle cx="102" cy="28" r="2" fill="#1E6B47"/>
</svg>
