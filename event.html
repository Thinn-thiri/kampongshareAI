<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event · KampongShare</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/events.js"></script>
    <script src="/js/volunteering.js"></script>
    <script src="/js/event-page.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  </head>
  <body>
    <header class="topbar" x-data="topBar">
      <div class="container-page flex min-h-16 flex-wrap items-center gap-x-3 gap-y-2 py-2">
        <a href="/" class="flex items-center gap-2 rounded-sm font-bold text-primary focus-visible:outline-2 focus-visible:outline-primary" aria-label="KampongShare home">
          <img src="/img/favicon.svg" alt="" class="size-8" />
          <span class="hidden sm:inline">KampongShare</span>
        </a>
        <span class="text-line" aria-hidden="true">/</span>
        <span class="min-w-0 flex-1 truncate font-semibold">Event</span>
        <nav class="segmented order-last w-full sm:order-none sm:w-auto" aria-label="Switch between donating and volunteering" x-show="canSwitch" x-cloak>
          <a href="/donor.html" class="segmented-link" :aria-current="here('/donor.html') ? 'page' : null">Donating</a>
          <a href="/volunteer.html" class="segmented-link" :aria-current="here('/volunteer.html') ? 'page' : null">Volunteering</a>
        </nav>
        <nav class="flex items-center gap-1" aria-label="Account" x-show="ready && !profile" x-cloak>
          <a href="/login.html" class="btn btn-ghost px-3">Log in</a>
          <a href="/signup.html" class="btn btn-primary px-4">Sign up</a>
        </nav>
        <div class="relative" x-show="profile" x-cloak @keydown.escape="open = false" @click.outside="open = false">
          <button type="button" class="btn btn-secondary px-4" :aria-expanded="open.toString()" aria-controls="account-menu" @click="open = !open">
            Account
          </button>
          <div id="account-menu" class="menu" x-show="open" x-cloak>
            <a :href="dashboard" href="/" class="menu-item">My dashboard</a>
            <a href="/profile.html" class="menu-item">My profile</a>
            <button type="button" class="menu-item" @click="logout()">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container-page py-8" x-data="eventPage">
      <!-- Loading -->
      <div class="mx-auto max-w-3xl space-y-4" x-show="loading" aria-busy="true" aria-label="Loading event">
        <div class="skeleton h-9 w-2/3"></div>
        <div class="skeleton h-5 w-1/2"></div>
        <div class="skeleton h-64 w-full"></div>
      </div>

      <!-- Not available -->
      <div class="mx-auto max-w-xl card space-y-3 py-10 text-center" x-show="!loading && (notFound || error)" x-cloak>
        <h1 class="text-2xl font-bold">This event isn't available</h1>
        <p class="text-muted" x-text="error || 'It may have ended, been removed, or still be waiting for approval.'"></p>
        <a href="/" class="btn btn-primary">See upcoming events</a>
      </div>

      <!-- Event -->
      <article class="mx-auto max-w-3xl space-y-6" x-show="!loading && event" x-cloak>
        <div>
          <p class="font-medium text-primary" x-text="event?.organization?.name"></p>
          <h1 class="text-2xl font-bold break-words sm:text-3xl" x-text="event?.title"></h1>
          <span class="badge badge-neutral mt-2" x-show="isOver">This event has ended</span>
        </div>

        <dl class="card grid gap-x-4 gap-y-3 sm:grid-cols-[max-content_1fr]">
          <dt class="font-medium text-muted">When</dt>
          <dd x-text="event ? formatEventTime(event.starts_at, event.ends_at) : ''"></dd>
          <dt class="font-medium text-muted">Where</dt>
          <dd class="break-words" x-text="event?.location_name"></dd>
          <dt class="font-medium text-muted">Volunteers</dt>
          <dd x-text="!event ? '' : !event.volunteers_needed ? 'Everyone welcome' : isFull ? `Event full (${event.volunteers_needed} needed)` : `${spots} of ${event.volunteers_needed} spots left`"></dd>
        </dl>

        <div class="isolate overflow-hidden rounded-lg border border-line">
          <div id="event-map" class="h-64 w-full"></div>
        </div>

        <section class="space-y-2" x-show="event?.description" aria-labelledby="about-heading">
          <h2 id="about-heading" class="text-lg font-semibold">About this event</h2>
          <p class="whitespace-pre-line break-words" x-text="event?.description"></p>
        </section>

        <div class="grid gap-4 sm:grid-cols-2 sm:items-start">
          <!-- Donate -->
          <div class="space-y-1">
            <a :href="donateHref" href="/donor.html" class="btn btn-primary min-h-14 w-full text-base">Donate</a>
            <p class="helper-text text-center" x-text="event?.request?.status === 'open' ? `Give to: ${event.request.title}` : 'See what this organization needs'"></p>
          </div>

          <!-- Volunteer -->
          <div class="space-y-2" aria-live="polite">
            <template x-if="volunteerState === 'can_apply' && !showApply">
              <button type="button" class="btn btn-secondary min-h-14 w-full text-base" :disabled="busy"
                @click="myApplication?.status === 'withdrawn' ? apply() : openApply()"
                x-text="myApplication?.status === 'withdrawn' ? 'Volunteer again' : 'Volunteer'"></button>
            </template>
            <template x-if="volunteerState === 'visitor'">
              <div class="space-y-1">
                <a :href="loginHref" class="btn btn-secondary min-h-14 w-full text-base">Volunteer</a>
                <p class="helper-text text-center">Log in or sign up to volunteer — we'll bring you back here.</p>
              </div>
            </template>
            <template x-if="volunteerState === 'ended'">
              <button type="button" class="btn btn-secondary min-h-14 w-full text-base" disabled>Event ended</button>
            </template>
            <template x-if="volunteerState === 'full'">
              <button type="button" class="btn btn-secondary min-h-14 w-full text-base" disabled>Event full</button>
            </template>
            <template x-if="volunteerState === 'not_individual'">
              <p class="rounded-md bg-canvas p-3 text-center text-sm text-muted">Organization and admin accounts can't volunteer.</p>
            </template>
            <template x-if="volunteerState === 'turn_on'">
              <div class="space-y-2 rounded-md border border-line bg-canvas p-3 text-center text-sm">
                <p>Turn on volunteering in your profile to do this.</p>
                <button type="button" class="btn btn-secondary w-full" :disabled="busy" @click="turnOnVolunteering()">
                  <span class="spinner" x-show="busy" x-cloak aria-hidden="true"></span>
                  Turn on volunteering
                </button>
              </div>
            </template>
            <template x-if="volunteerState === 'consent'">
              <div class="space-y-2 rounded-md border border-warning bg-warning-soft p-3 text-center text-sm text-warning">
                <p>Please confirm the privacy consent and that you're 18 or older first.</p>
                <a href="/profile.html" class="btn btn-secondary w-full">Go to my profile</a>
              </div>
            </template>
            <template x-if="volunteerState === 'applied' && myApplication">
              <div class="space-y-2 rounded-md border border-line bg-canvas p-3 text-center text-sm">
                <p>Your application: <span :class="badges[myApplication.status].className" x-text="badges[myApplication.status].label"></span></p>
                <button type="button" class="btn btn-ghost w-full" x-show="myApplication.status === 'pending' || myApplication.status === 'approved'"
                  :disabled="busy || myApplication.status === 'approved'"
                  :aria-describedby="myApplication.status === 'approved' ? 'confirmed-note' : null" @click="withdraw()">Withdraw</button>
                <p id="confirmed-note" class="helper-text mt-0" x-show="myApplication.status === 'approved'" x-text="confirmedNote"></p>
              </div>
            </template>

            <!-- Apply form -->
            <form class="space-y-3 rounded-md border border-primary-soft bg-canvas p-4" novalidate x-show="showApply && volunteerState === 'can_apply'" x-cloak @submit.prevent="apply">
              <div>
                <label for="apply-message" class="label">Message to the organization <span class="font-normal text-muted">(optional)</span></label>
                <textarea id="apply-message" class="input py-2" rows="2" maxlength="500" x-model="applyMessage" aria-describedby="apply-help"></textarea>
                <p id="apply-help" class="helper-text" x-text="`${applyMessage.length} / 500`"></p>
              </div>
              <div role="alert">
                <p class="rounded-md bg-danger-soft p-3 text-sm font-medium text-danger" x-show="applyError" x-text="applyError"></p>
              </div>
              <div class="flex flex-wrap gap-3">
                <button type="submit" class="btn btn-primary" :disabled="busy">
                  <span class="spinner" x-show="busy" x-cloak aria-hidden="true"></span>
                  Send application
                </button>
                <button type="button" class="btn btn-ghost" @click="showApply = false">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
