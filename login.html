<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · KampongShare</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/login.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  </head>
  <body>
    <header class="topbar" x-data="topBar">
      <div class="container-page flex min-h-16 flex-wrap items-center gap-x-3 gap-y-2 py-2">
        <a href="/" class="flex items-center gap-2 rounded-sm font-bold text-primary focus-visible:outline-2 focus-visible:outline-primary" aria-label="KampongShare home">
          <img src="/img/favicon.svg" alt="" class="size-8" />
          <span class="hidden sm:inline">KampongShare</span>
        </a>
        <span class="text-line" aria-hidden="true">/</span>
        <span class="min-w-0 flex-1 truncate font-semibold">Log in</span>
        <nav class="segmented order-last w-full sm:order-none sm:w-auto" aria-label="Switch between donating and volunteering" x-show="canSwitch" x-cloak>
          <a href="/donor.html" class="segmented-link" :aria-current="here('/donor.html') ? 'page' : null">Donating</a>
          <a href="/volunteer.html" class="segmented-link" :aria-current="here('/volunteer.html') ? 'page' : null">Volunteering</a>
        </nav>
        <nav class="flex items-center gap-1" aria-label="Account" x-show="ready && !profile" x-cloak>
          <a href="/login.html" class="btn btn-ghost px-3">Log in</a>
          <a href="/signup.html" class="btn btn-primary px-4">Sign up</a>
        </nav>
        <div class="relative" x-show="profile" x-cloak @keydown.escape="if (open) { open = false; $refs.accountButton.focus() }" @click.outside="open = false">
          <button type="button" x-ref="accountButton" class="btn btn-secondary px-4" :aria-expanded="open.toString()" aria-controls="account-menu" @click="open = !open">
            Account
          </button>
          <div id="account-menu" class="menu" x-show="open" x-cloak>
            <a :href="dashboard" href="/" class="menu-item">My dashboard</a>
            <a href="/profile.html" class="menu-item">My profile</a>
            <button type="button" class="menu-item" @click="logout()">Log out</button>
          </div>
        </div>
      </div>
        <nav class="bottom-nav" aria-label="Main" x-show="ready" x-cloak>
          <template x-for="link in bottomLinks" :key="link.href">
            <a :href="link.href" class="bottom-nav-link" :aria-current="isCurrent(link.href) ? 'page' : null">
              <i :data-lucide="link.icon" class="size-5" aria-hidden="true"></i>
              <span x-text="link.label"></span>
            </a>
          </template>
        </nav>
    </header>

    <main class="container-page py-12">
      <div class="mx-auto max-w-md">
        <h1 class="text-2xl font-bold sm:text-3xl">Welcome back</h1>
        <p class="mt-2 text-muted">Log in to give, volunteer or manage your organization.</p>

        <form class="card mt-6 space-y-5" novalidate x-data="loginForm" @submit.prevent="submit">
          <div>
            <label for="li-email" class="label">Email</label>
            <input id="li-email" class="input" type="email" autocomplete="email" required x-model="email" />
          </div>
          <div>
            <label for="li-password" class="label">Password</label>
            <div class="password-field" x-data="passwordToggle">
              <input id="li-password" class="input" type="password" :type="shown ? 'text' : 'password'" x-ref="input" autocomplete="current-password" required x-model="password" />
              <button type="button" class="password-toggle" @mousedown.prevent @click="toggle($event)" aria-controls="li-password"
                aria-label="Show password" :aria-label="shown ? 'Hide password' : 'Show password'" :aria-pressed="shown ? 'true' : 'false'">
                <span x-show="!shown"><i data-lucide="eye" class="size-5" aria-hidden="true"></i></span>
                <span x-show="shown" x-cloak><i data-lucide="eye-off" class="size-5" aria-hidden="true"></i></span>
              </button>
            </div>
          </div>

          <div role="alert">
            <p class="rounded-md bg-danger-soft p-3 text-sm font-medium text-danger" x-show="error" x-text="error"></p>
          </div>

          <button type="submit" class="btn btn-primary w-full" :disabled="busy">
            <span class="spinner" x-show="busy" x-cloak aria-hidden="true"></span>
            <span x-text="busy ? 'Logging in…' : 'Log in'">Log in</span>
          </button>

          <p class="text-center text-sm text-muted">
            New to KampongShare? <a :href="signupHref" href="/signup.html" class="font-semibold text-primary underline">Create an account</a>
          </p>
        </form>

        <p class="mt-6 text-center text-sm text-muted">
          <a href="/privacy.html" class="underline hover:text-ink">Privacy Notice</a>
        </p>
      </div>
    </main>
  </body>
</html>
