<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- sets light / dark before anything is drawn (no white flash) -->
    <script src="/js/theme.js"></script>
    <!-- languages: the three dictionaries, then js/i18n.js sets <html lang> and translates before drawing -->
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/zh.js"></script>
    <script src="/js/i18n/ms.js"></script>
    <script src="/js/i18n.js"></script>
    <title data-i18n="login.pageTitle">Log in · KampongShare</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/messaging.js"></script>
    <script src="/js/login.js"></script>
    <script src="/js/chat-questions.js"></script>
    <script src="/js/chat.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  </head>
  <body>
    <a href="#main" class="skip-link" data-i18n="nav.skip">Skip to main content</a>
    <header class="topbar" x-data="topBar">
      <div class="container-page flex min-h-16 flex-wrap items-center gap-x-1 gap-y-2 py-2 sm:gap-x-3">
        <a href="/" class="flex items-center gap-2 rounded-sm font-bold text-primary focus-visible:outline-2 focus-visible:outline-primary" aria-label="KampongShare home" data-i18n-attr="aria-label:nav.homeLink">
          <img src="/img/favicon.svg" alt="" class="size-8" />
          <span class="hidden sm:inline">KampongShare</span>
        </a>
        <!-- the logged-in person's own name (only they see it) -->
        <span class="max-w-16 truncate rounded-full bg-primary-soft px-2.5 py-1 text-xs font-semibold text-primary min-[400px]:max-w-24 sm:max-w-48"
          x-show="profile?.full_name" x-cloak :title="profile?.full_name"><span class="sr-only" data-i18n="nav.loggedInAs">Logged in as</span> <span x-text="profile?.full_name"></span></span>
        <!-- pushes the links and buttons to the right -->
        <span class="flex-1" aria-hidden="true"></span>
        <!-- Desktop links (phones use the bottom navigation) -->
        <nav class="hidden items-center gap-1 sm:flex" aria-label="Site" data-i18n-attr="aria-label:nav.site" x-show="ready" x-cloak>
          <template x-for="link in topLinks" :key="link.href">
            <a :href="link.href" class="top-link gap-2" :aria-current="isCurrent(link.href) ? 'page' : null">
              <span x-text="$t(link.labelKey)"></span>
              <span class="badge badge-warning" x-show="link.badge" x-text="link.badge" :aria-label="$t('nav.waiting', { count: link.badge })"></span>
            </a>
          </template>
        </nav>
        <nav class="segmented order-last w-full sm:order-none sm:w-auto" aria-label="Switch between donating and volunteering" data-i18n-attr="aria-label:nav.switchRole" x-show="canSwitch" x-cloak>
          <a href="/donor.html" class="segmented-link" :aria-current="here('/donor.html') ? 'page' : null" data-i18n="nav.donating">Donating</a>
          <a href="/volunteer.html" class="segmented-link" :aria-current="here('/volunteer.html') ? 'page' : null" data-i18n="nav.volunteering">Volunteering</a>
        </nav>
        <!-- Language: English / 中文 / Bahasa Melayu (js/i18n.js) -->
        <div class="relative" x-data="langMenu" @keydown.escape="close(true)" @click.outside="close(false)">
          <button type="button" x-ref="langButton" class="btn btn-ghost min-w-11 gap-1.5 px-2" :aria-label="buttonLabel" aria-label="Language / 语言 / Bahasa"
            aria-haspopup="menu" :aria-expanded="open.toString()" aria-controls="lang-menu" @click="toggle()">
            <i data-lucide="globe" class="size-5" aria-hidden="true"></i>
            <span class="text-sm sm:hidden" :lang="current.htmlLang" x-text="current.short"></span>
            <span class="hidden text-sm sm:inline" :lang="current.htmlLang" x-text="current.name"></span>
          </button>
          <div id="lang-menu" class="menu w-48" role="menu" aria-label="Language / 语言 / Bahasa" x-show="open" x-cloak @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)">
            <template x-for="option in options" :key="option.code">
              <button type="button" class="menu-item gap-2" role="menuitemradio" :lang="option.htmlLang" :aria-checked="(lang === option.code).toString()" @click="pick(option.code)">
                <span class="flex-1" x-text="option.name"></span>
                <span class="text-primary" x-show="lang === option.code"><i data-lucide="check" class="size-4" aria-hidden="true"></i></span>
              </button>
            </template>
          </div>
        </div>
        <!-- Theme: System / Light / Dark (js/theme.js) -->
        <div class="relative" x-data="themeMenu" @keydown.escape="close(true)" @click.outside="close(false)">
          <button type="button" x-ref="themeButton" class="btn btn-ghost size-11 px-0" :aria-label="$t('theme.button', { name: label })" aria-label="Theme"
            aria-haspopup="menu" :aria-expanded="open.toString()" aria-controls="theme-menu" @click="toggle()">
            <span x-show="choice === 'system'"><i data-lucide="monitor" class="size-5" aria-hidden="true"></i></span>
            <span x-show="choice === 'light'" x-cloak><i data-lucide="sun" class="size-5" aria-hidden="true"></i></span>
            <span x-show="choice === 'dark'" x-cloak><i data-lucide="moon" class="size-5" aria-hidden="true"></i></span>
          </button>
          <div id="theme-menu" class="menu w-40" role="menu" aria-label="Theme" data-i18n-attr="aria-label:theme.menu" x-show="open" x-cloak @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)">
            <template x-for="option in options" :key="option.value">
              <button type="button" class="menu-item gap-2" role="menuitemradio" :aria-checked="(choice === option.value).toString()" @click="pick(option.value)">
                <span x-show="option.icon === 'monitor'"><i data-lucide="monitor" class="size-4" aria-hidden="true"></i></span>
                <span x-show="option.icon === 'sun'"><i data-lucide="sun" class="size-4" aria-hidden="true"></i></span>
                <span x-show="option.icon === 'moon'"><i data-lucide="moon" class="size-4" aria-hidden="true"></i></span>
                <span class="flex-1" x-text="$t(`theme.${option.value}`)"></span>
                <span class="text-primary" x-show="choice === option.value"><i data-lucide="check" class="size-4" aria-hidden="true"></i></span>
              </button>
            </template>
          </div>
        </div>
        <nav class="flex items-center gap-1" aria-label="Account" data-i18n-attr="aria-label:nav.account" x-show="ready && !profile" x-cloak>
          <a href="/login.html" class="btn btn-ghost hidden px-3 sm:inline-flex" data-i18n="nav.logIn">Log in</a>
          <a href="/signup.html" class="btn btn-primary px-4" data-i18n="nav.signUp">Sign up</a>
        </nav>
        <!-- Messages with the unread count (js/messaging.js): individuals and organizations -->
        <a href="/messages.html" class="btn btn-ghost relative size-11 px-0" x-show="showMessages" x-cloak
          :aria-current="here('/messages.html') ? 'page' : null" aria-label="Messages"
          :aria-label="unread ? $t('nav.messagesUnread', { count: unread }) : $t('nav.messages')">
          <i data-lucide="message-circle" class="size-5" aria-hidden="true"></i>
          <span class="nav-count" x-show="unread" x-cloak x-text="unread > 99 ? '99+' : unread" aria-hidden="true"></span>
        </a>
        <div class="relative" x-show="profile" x-cloak @keydown.escape="if (open) { open = false; $refs.accountButton.focus() }" @click.outside="open = false">
          <button type="button" x-ref="accountButton" class="btn btn-secondary min-w-11 px-2 sm:px-4" :aria-expanded="open.toString()" aria-controls="account-menu" @click="open = !open">
            <!-- phones: an icon (the name is still read out), so the top bar fits on one row -->
            <i data-lucide="user-round" class="size-5 sm:hidden" aria-hidden="true"></i>
            <span class="sr-only sm:not-sr-only" data-i18n="nav.account">Account</span>
          </button>
          <div id="account-menu" class="menu" x-show="open" x-cloak>
            <a :href="dashboard" href="/" class="menu-item sm:hidden" data-i18n="nav.myDashboard">My dashboard</a>
            <a href="/profile.html" class="menu-item" data-i18n="nav.myProfile">My profile</a>
            <button type="button" class="menu-item" @click="logout()" data-i18n="nav.logOut">Log out</button>
          </div>
        </div>
      </div>
        <nav class="bottom-nav" aria-label="Main" data-i18n-attr="aria-label:nav.main" x-show="ready" x-cloak>
          <template x-for="link in bottomLinks" :key="link.href">
            <a :href="link.href" class="bottom-nav-link" :aria-current="isCurrent(link.href) ? 'page' : null">
              <i :data-lucide="link.icon" class="size-5" aria-hidden="true"></i>
              <span x-text="$t(link.labelKey)"></span>
            </a>
          </template>
        </nav>
    </header>

    <main id="main" tabindex="-1" class="container-page py-12 focus:outline-none">
      <div class="mx-auto max-w-md">
        <h1 class="text-2xl font-bold sm:text-3xl" data-i18n="login.title">Welcome back</h1>
        <p class="mt-2 text-muted" data-i18n="login.intro">Log in to give, volunteer or manage your organization.</p>

        <form class="card mt-6 space-y-5" novalidate x-data="loginForm" @submit.prevent="submit">
          <div>
            <label for="li-email" class="label" data-i18n="login.email">Email</label>
            <input id="li-email" class="input" type="email" autocomplete="email" required x-model="email" />
          </div>
          <div>
            <label for="li-password" class="label" data-i18n="login.password">Password</label>
            <div class="password-field" x-data="passwordToggle">
              <input id="li-password" class="input" type="password" :type="shown ? 'text' : 'password'" x-ref="input" autocomplete="current-password" required x-model="password" />
              <button type="button" class="password-toggle" @mousedown.prevent @click="toggle($event)" aria-controls="li-password"
                aria-label="Show password" :aria-label="shown ? $t('ui.hidePassword') : $t('ui.showPassword')" :aria-pressed="shown ? 'true' : 'false'">
                <span x-show="!shown"><i data-lucide="eye" class="size-5" aria-hidden="true"></i></span>
                <span x-show="shown" x-cloak><i data-lucide="eye-off" class="size-5" aria-hidden="true"></i></span>
              </button>
            </div>
          </div>

          <div role="alert">
            <p class="rounded-md bg-danger-soft p-3 text-sm font-medium text-danger" x-show="error" x-text="error"></p>
          </div>

          <button type="submit" class="btn btn-primary w-full" :disabled="busy">
            <span class="spinner" x-show="busy" x-cloak aria-hidden="true"></span>
            <span x-text="busy ? $t('login.busy') : $t('login.submit')">Log in</span>
          </button>

          <p class="text-center text-sm text-muted">
            <span data-i18n="login.newHere">New to KampongShare?</span> <a :href="signupHref" href="/signup.html" class="font-semibold text-primary underline" data-i18n="login.create">Create an account</a>
          </p>
        </form>

        <p class="mt-6 text-center text-sm text-muted">
          <a href="/privacy.html" class="underline hover:text-ink" data-i18n="common.privacyNotice">Privacy Notice</a>
        </p>
      </div>
    </main>
  </body>
</html>
