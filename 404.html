<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- sets light / dark before anything is drawn (no white flash) -->
    <script src="/js/theme.js"></script>
    <!-- languages: the three dictionaries, then js/i18n.js sets <html lang> and translates before drawing -->
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/zh.js"></script>
    <script src="/js/i18n/ms.js"></script>
    <script src="/js/i18n.js"></script>
    <title data-i18n="notFound.pageTitle">Page not found · KampongShare</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Lexend:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/messaging.js"></script>
    <script src="/js/chat-questions.js"></script>
    <script src="/js/chat.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  </head>
  <body>
    <a href="#main" class="skip-link" data-i18n="nav.skip">Skip to main content</a>
    <header class="topbar" x-data="topBar">
      <div class="container-page flex min-h-16 items-center gap-2 py-2">
        <a href="/" class="flex min-h-11 items-center gap-2 rounded-sm font-bold text-primary" aria-label="KampongShare home" data-i18n-attr="aria-label:nav.homeLink">
          <img src="/img/favicon.svg" alt="" class="size-8" />
          <span class="hidden sm:inline" translate="no">KampongShare</span>
        </a>
        <!-- pushes the links and buttons to the right -->
        <span class="flex-1" aria-hidden="true"></span>
        <!-- Desktop links (phones and tablets use the bottom bar) -->
        <nav class="hidden items-center gap-1 lg:flex" aria-label="Site" data-i18n-attr="aria-label:nav.site" x-show="ready" x-cloak>
          <template x-for="link in topLinks" :key="link.href">
            <a :href="link.href" class="top-link" :aria-current="isCurrent(link.href) ? 'page' : null">
              <span x-text="$t(link.labelKey)"></span>
              <span class="tab-count" x-show="link.badge" x-text="link.badge" :aria-label="$t('nav.waiting', { count: link.badge })"></span>
            </a>
          </template>
        </nav>
        <!-- visitors: Log in · Sign up -->
        <a href="/login.html" class="btn btn-quiet hidden sm:inline-flex" x-show="ready && !profile" x-cloak data-i18n="nav.logIn">Log in</a>
        <a href="/signup.html" class="btn btn-primary px-4" x-show="ready && !profile" x-cloak data-i18n="nav.signUp">Sign up</a>
        <!-- Messages with the unread count (js/messaging.js): individuals and organizations -->
        <a href="/messages.html" class="icon-btn relative" x-show="showMessages" x-cloak
          :aria-current="here('/messages.html') ? 'page' : null" aria-label="Messages"
          :aria-label="unread ? $t('nav.messagesUnread', { count: unread }) : $t('nav.messages')">
          <i class="ph ph-chat-circle" aria-hidden="true"></i>
          <span class="nav-count" x-show="unread" x-cloak x-text="unread > 99 ? '99+' : unread" aria-hidden="true"></span>
        </a>
        <!-- Avatar menu (logged in) or settings menu (visitors): theme, language, profile, switch, log out -->
        <div class="relative" x-data="accountMenu" @keydown.escape="close(true)" @click.outside="close(false)">
          <button type="button" x-ref="menuButton" class="icon-btn gap-1" :class="profile ? '' : 'w-auto px-3'" :aria-label="buttonLabel"
            aria-label="Settings · Language / 语言 / Bahasa" aria-haspopup="menu" :aria-expanded="open.toString()" aria-controls="account-menu" @click="toggle()">
            <span class="avatar" x-show="profile" x-cloak x-text="initial" aria-hidden="true"></span>
            <i class="ph ph-gear-six" x-show="!profile" aria-hidden="true"></i>
            <span class="text-sm font-bold" x-show="!profile" :lang="language.htmlLang" x-text="language.short" aria-hidden="true"></span>
          </button>
          <div id="account-menu" class="menu w-64" role="menu" :aria-label="buttonLabel" x-show="open" x-cloak
            @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)" @keydown.home.prevent="moveTo(0)" @keydown.end.prevent="moveTo(-1)">
            <template x-if="profile">
              <div role="none">
                <p class="menu-heading font-bold break-words text-ink" aria-hidden="true" x-text="profile.full_name"></p>
                <div role="group" :aria-label="profile.full_name">
                  <a :href="dashboard" class="menu-item" role="menuitem" x-show="!canSwitch"><i class="ph ph-squares-four" aria-hidden="true"></i><span data-i18n="nav.myDashboard">My dashboard</span></a>
                  <a href="/donor.html" class="menu-item" role="menuitem" x-show="canSwitch" :aria-current="here('/donor.html') ? 'page' : null"><i class="ph ph-hand-heart" aria-hidden="true"></i><span data-i18n="nav.donating">Donating</span></a>
                  <a href="/volunteer.html" class="menu-item" role="menuitem" x-show="canSwitch" :aria-current="here('/volunteer.html') ? 'page' : null"><i class="ph ph-users" aria-hidden="true"></i><span data-i18n="nav.volunteering">Volunteering</span></a>
                  <a href="/profile.html" class="menu-item" role="menuitem" :aria-current="here('/profile.html') ? 'page' : null"><i class="ph ph-user" aria-hidden="true"></i><span data-i18n="nav.myProfile">My profile</span></a>
                </div>
                <div class="menu-separator" role="separator"></div>
              </div>
            </template>
            <p class="menu-heading" aria-hidden="true" data-i18n="theme.menu">Theme</p>
            <div role="group" aria-label="Theme" data-i18n-attr="aria-label:theme.menu">
              <template x-for="option in themeOptions" :key="option.value">
                <button type="button" class="menu-item" role="menuitemradio" :aria-checked="(theme === option.value).toString()" @click="pickTheme(option.value)">
                  <i :class="option.icon" aria-hidden="true"></i>
                  <span class="flex-1" x-text="$t(`theme.${option.value}`)"></span>
                  <i class="ph ph-check text-primary" x-show="theme === option.value" aria-hidden="true"></i>
                </button>
              </template>
            </div>
            <div class="menu-separator" role="separator"></div>
            <p class="menu-heading" aria-hidden="true">Language / 语言 / Bahasa</p>
            <div role="group" aria-label="Language / 语言 / Bahasa">
              <template x-for="option in languages" :key="option.code">
                <button type="button" class="menu-item" role="menuitemradio" :lang="option.htmlLang" :aria-checked="(lang === option.code).toString()" @click="pickLang(option.code)">
                  <i class="ph ph-globe" aria-hidden="true"></i>
                  <span class="flex-1" x-text="option.name"></span>
                  <i class="ph ph-check text-primary" x-show="lang === option.code" aria-hidden="true"></i>
                </button>
              </template>
            </div>
            <template x-if="profile">
              <div role="none">
                <div class="menu-separator" role="separator"></div>
                <button type="button" class="menu-item" role="menuitem" @click="logout()"><i class="ph ph-sign-out" aria-hidden="true"></i><span data-i18n="nav.logOut">Log out</span></button>
              </div>
            </template>
          </div>
        </div>
      </div>
      <nav class="bottom-nav" aria-label="Main" data-i18n-attr="aria-label:nav.main" x-show="ready" x-cloak>
        <template x-for="link in bottomLinks" :key="link.href">
          <a :href="link.href" class="bottom-nav-link" :aria-current="isCurrent(link.href) ? 'page' : null">
            <i :class="link.icon" aria-hidden="true"></i>
            <span x-text="$t(link.labelKey)"></span>
          </a>
        </template>
      </nav>
    </header>

    <!-- Every text here comes from privacy.* in js/i18n/en.js, zh.js and ms.js.
         The Chinese and Malay versions need review by a native speaker before a real launch. -->
    <main id="main" tabindex="-1" class="container-page py-12 focus:outline-none">
      <div class="empty mx-auto max-w-xl">
        <img src="/img/pinny-looking.svg" alt="" class="w-32" />
        <h1 class="title" data-i18n="notFound.title">We can't find that page</h1>
        <p class="text-muted" data-i18n="notFound.text">Pinny looked everywhere. The link may be old, or the page has moved.</p>
        <a href="/" class="btn btn-primary" data-i18n="notFound.home">Go to the home page</a>
      </div>
    </main>
  </body>
</html>
