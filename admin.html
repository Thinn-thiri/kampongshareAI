<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin · KampongShare</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/orgs.js"></script>
    <script src="/js/requests.js"></script>
    <script src="/js/admin-dashboard.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  </head>
  <body data-require="admin">
    <header class="topbar" x-data="topBar">
      <div class="container-page flex min-h-16 flex-wrap items-center gap-x-3 gap-y-2 py-2">
        <a href="/" class="flex items-center gap-2 rounded-sm font-bold text-primary focus-visible:outline-2 focus-visible:outline-primary" aria-label="KampongShare home">
          <img src="/img/favicon.svg" alt="" class="size-8" />
          <span class="hidden sm:inline">KampongShare</span>
        </a>
        <span class="text-line" aria-hidden="true">/</span>
        <span class="min-w-0 flex-1 truncate font-semibold">Admin</span>
        <nav class="segmented order-last w-full sm:order-none sm:w-auto" aria-label="Switch between donating and volunteering" x-show="canSwitch" x-cloak>
          <a href="/donor.html" class="segmented-link" :aria-current="here('/donor.html') ? 'page' : null">Donating</a>
          <a href="/volunteer.html" class="segmented-link" :aria-current="here('/volunteer.html') ? 'page' : null">Volunteering</a>
        </nav>
        <nav class="flex items-center gap-1" aria-label="Account" x-show="ready && !profile" x-cloak>
          <a href="/login.html" class="btn btn-ghost px-3">Log in</a>
          <a href="/signup.html" class="btn btn-primary px-4">Sign up</a>
        </nav>
        <div class="relative" x-show="profile" x-cloak @keydown.escape="open = false" @click.outside="open = false">
          <button type="button" class="btn btn-secondary px-4" :aria-expanded="open.toString()" aria-controls="account-menu" @click="open = !open">
            Account
          </button>
          <div id="account-menu" class="menu" x-show="open" x-cloak>
            <a :href="dashboard" href="/" class="menu-item">My dashboard</a>
            <a href="/profile.html" class="menu-item">My profile</a>
            <button type="button" class="menu-item" @click="logout()">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="container-page space-y-8 py-8" x-data="adminDashboard">
      <div>
        <h1 class="text-2xl font-bold sm:text-3xl">Admin dashboard</h1>
        <p class="mt-1 text-muted">Review what's waiting. Choose a card to open its queue.</p>
      </div>

      <!-- Summary cards (7.1) -->
      <section aria-label="Summary">
        <div class="grid grid-cols-2 gap-4 lg:grid-cols-5">
          <template x-for="queue in queues" :key="queue.key">
            <button type="button" class="card text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
              :class="activeQueue === queue.key ? 'border-primary ring-2 ring-primary-soft' : ''"
              :aria-pressed="(activeQueue === queue.key).toString()" @click="openQueue(queue.key)">
              <span class="block text-sm text-muted" x-text="queue.label"></span>
              <span class="mt-1 block text-3xl font-bold" x-text="counts ? counts[queue.key] : '–'">–</span>
              <span class="mt-1 block text-xs text-muted" x-show="!queue.built">Queue coming soon</span>
            </button>
          </template>
        </div>
        <p class="field-error" x-show="countsError" x-text="countsError" role="alert"></p>
      </section>

      <!-- Organizations queue (7.2 / 7.3) -->
      <section class="space-y-4" x-show="activeQueue === 'organizations'" aria-labelledby="orgs-heading">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h2 id="orgs-heading" class="text-xl font-semibold">Organizations</h2>
          <div class="segmented w-full sm:w-auto" role="group" aria-label="Show organizations">
            <template x-for="tab in orgTabs" :key="tab.value">
              <button type="button" class="segmented-link" :aria-current="orgTab === tab.value ? 'page' : null"
                @click="showTab(tab.value)" x-text="tab.label"></button>
            </template>
          </div>
        </div>

        <div class="space-y-4" x-show="loadingOrgs" aria-busy="true" aria-label="Loading organizations">
          <div class="card space-y-3">
            <div class="skeleton h-6 w-1/3"></div>
            <div class="skeleton h-4 w-2/3"></div>
            <div class="skeleton h-4 w-1/2"></div>
          </div>
        </div>

        <div class="card text-center" x-show="!loadingOrgs && orgsError" x-cloak role="alert">
          <p class="text-danger" x-text="orgsError"></p>
          <button type="button" class="btn btn-secondary mt-3" @click="loadOrgs()">Try again</button>
        </div>

        <div class="card flex flex-col items-center gap-2 py-10 text-center" x-show="!loadingOrgs && !orgsError && orgs.length === 0" x-cloak>
          <p class="text-muted" x-text="emptyText"></p>
        </div>

        <div class="space-y-4" x-show="!loadingOrgs && !orgsError">
          <template x-for="org in orgs" :key="org.id">
            <article class="card grid gap-5 md:grid-cols-[1fr_280px]">
              <div class="min-w-0 space-y-3">
                <div>
                  <h3 class="text-lg font-semibold break-words" x-text="org.name"></h3>
                  <p class="text-sm text-muted" x-text="`Submitted ${formatDate(org.created_at)}`"></p>
                </div>
                <p class="whitespace-pre-line break-words" x-show="org.description" x-text="org.description"></p>
                <dl class="grid gap-x-4 gap-y-2 text-sm sm:grid-cols-[max-content_1fr]">
                  <dt class="font-medium text-muted">Address</dt>
                  <dd class="break-words" x-text="org.address || '—'"></dd>
                  <dt class="font-medium text-muted">Organization phone</dt>
                  <dd x-text="org.phone || '—'"></dd>
                  <dt class="font-medium text-muted">Owner <span class="font-normal">(for review only)</span></dt>
                  <dd x-text="org.owner ? `${org.owner.full_name || 'No name'}${org.owner.phone ? ' · ' + org.owner.phone : ''}` : '—'"></dd>
                </dl>
                <div class="rounded-md border border-danger bg-danger-soft p-3 text-sm text-danger" x-show="org.approval === 'rejected' && org.admin_note">
                  <p class="font-semibold">Your rejection note</p>
                  <p class="mt-1 whitespace-pre-line" x-text="org.admin_note"></p>
                </div>

                <!-- Actions -->
                <div class="flex flex-wrap gap-3 pt-1" x-show="rejectingId !== org.id">
                  <button type="button" class="btn btn-primary" x-show="org.approval !== 'approved'" :disabled="busyId === org.id" @click="approve(org)">
                    <span class="spinner" x-show="busyId === org.id" x-cloak aria-hidden="true"></span>
                    Approve
                  </button>
                  <button type="button" class="btn btn-danger" x-show="org.approval !== 'rejected'" :disabled="busyId === org.id" @click="startReject(org)">
                    Reject
                  </button>
                </div>

                <!-- Reject note -->
                <div class="space-y-3 rounded-md border border-line bg-canvas p-4" x-show="rejectingId === org.id" x-cloak>
                  <div>
                    <label :for="`reject-note-${org.id}`" class="label">Reason for rejecting <span class="text-danger" aria-hidden="true">*</span></label>
                    <textarea :id="`reject-note-${org.id}`" class="input py-2" rows="3" maxlength="500" x-model="rejectNote"
                      :aria-invalid="rejectError ? 'true' : null" :aria-describedby="`reject-help-${org.id} reject-error-${org.id}`"></textarea>
                    <p :id="`reject-help-${org.id}`" class="helper-text">The organization will see this note. Explain what to fix.</p>
                    <p :id="`reject-error-${org.id}`" class="field-error" x-show="rejectError" x-text="rejectError"></p>
                  </div>
                  <div class="flex flex-wrap gap-3">
                    <button type="button" class="btn btn-danger" :disabled="busyId === org.id" @click="confirmReject(org)">
                      <span class="spinner" x-show="busyId === org.id" x-cloak aria-hidden="true"></span>
                      Reject organization
                    </button>
                    <button type="button" class="btn btn-ghost" @click="cancelReject()">Cancel</button>
                  </div>
                </div>
              </div>

              <div>
                <div class="isolate h-48 overflow-hidden rounded-md border border-line md:h-full md:min-h-48"
                  x-show="org.latitude != null" x-init="showPin($el, org)"></div>
                <p class="rounded-md border border-line bg-canvas p-4 text-sm text-muted" x-show="org.latitude == null">No map pin was added.</p>
              </div>
            </article>
          </template>
        </div>
      </section>

      <!-- Donation requests queue (7.2) -->
      <section class="space-y-4" x-show="activeQueue === 'requests'" x-cloak aria-labelledby="reqs-heading">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h2 id="reqs-heading" class="text-xl font-semibold">Donation requests waiting for approval</h2>
          <button type="button" class="btn btn-ghost" @click="loadRequests()" :disabled="loadingReqs">Refresh</button>
        </div>

        <div class="card space-y-3" x-show="loadingReqs" aria-busy="true" aria-label="Loading requests">
          <div class="skeleton h-6 w-1/3"></div>
          <div class="skeleton h-4 w-2/3"></div>
          <div class="skeleton h-4 w-1/2"></div>
        </div>

        <div class="card text-center" x-show="!loadingReqs && reqsError" x-cloak role="alert">
          <p class="text-danger" x-text="reqsError"></p>
          <button type="button" class="btn btn-secondary mt-3" @click="loadRequests()">Try again</button>
        </div>

        <div class="card flex flex-col items-center gap-2 py-10 text-center" x-show="!loadingReqs && !reqsError && reqsLoaded && reqs.length === 0" x-cloak>
          <p class="text-muted">No requests waiting for review.</p>
        </div>

        <div class="space-y-4" x-show="!loadingReqs && !reqsError">
          <template x-for="request in reqs" :key="request.id">
            <article class="card space-y-4">
              <div>
                <p class="text-sm font-medium text-primary" x-text="request.organization?.name || 'Unknown organization'"></p>
                <h3 class="text-lg font-semibold break-words" x-text="request.title"></h3>
                <p class="text-sm text-muted" x-text="`Submitted ${formatDate(request.created_at)}`"></p>
              </div>
              <p class="whitespace-pre-line break-words" x-show="request.description" x-text="request.description"></p>

              <dl class="grid gap-x-4 gap-y-2 text-sm sm:grid-cols-[max-content_1fr]">
                <dt class="font-medium text-muted">Urgency</dt>
                <dd x-text="urgencyLabel(request.urgency)"></dd>
                <dt class="font-medium text-muted">Deadline</dt>
                <dd x-text="request.deadline ? formatDate(request.deadline) : 'None'"></dd>
                <dt class="font-medium text-muted">Drop-off</dt>
                <dd class="whitespace-pre-line break-words" x-text="request.dropoff_instructions || '—'"></dd>
              </dl>

              <div class="overflow-x-auto">
                <table class="w-full min-w-[20rem] text-left text-sm">
                  <caption class="sr-only">Items requested</caption>
                  <thead class="border-b border-line text-muted">
                    <tr>
                      <th scope="col" class="py-2 pr-3 font-medium">Item</th>
                      <th scope="col" class="py-2 pr-3 font-medium">Category</th>
                      <th scope="col" class="py-2 text-right font-medium">Quantity</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="item in request.request_items" :key="item.id">
                      <tr class="border-b border-line last:border-0">
                        <td class="py-2 pr-3 break-words" x-text="item.name"></td>
                        <td class="py-2 pr-3" x-text="categoryLabel(item.category)"></td>
                        <td class="py-2 text-right whitespace-nowrap" x-text="`${item.quantity_needed} ${item.unit}`"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <div class="flex flex-wrap gap-3" x-show="rejectingId !== request.id">
                <button type="button" class="btn btn-primary" :disabled="busyId === request.id" @click="approveRequest(request)">
                  <span class="spinner" x-show="busyId === request.id" x-cloak aria-hidden="true"></span>
                  Approve
                </button>
                <button type="button" class="btn btn-danger" :disabled="busyId === request.id" @click="startReject(request)">Reject</button>
              </div>

              <div class="space-y-3 rounded-md border border-line bg-canvas p-4" x-show="rejectingId === request.id" x-cloak>
                <div>
                  <label :for="`reject-note-${request.id}`" class="label">Reason for rejecting <span class="text-danger" aria-hidden="true">*</span></label>
                  <textarea :id="`reject-note-${request.id}`" class="input py-2" rows="3" maxlength="500" x-model="rejectNote"
                    :aria-invalid="rejectError ? 'true' : null" :aria-describedby="`reject-help-${request.id} reject-error-${request.id}`"></textarea>
                  <p :id="`reject-help-${request.id}`" class="helper-text">The organization will see this note. Explain what to change.</p>
                  <p :id="`reject-error-${request.id}`" class="field-error" x-show="rejectError" x-text="rejectError"></p>
                </div>
                <div class="flex flex-wrap gap-3">
                  <button type="button" class="btn btn-danger" :disabled="busyId === request.id" @click="confirmRejectRequest(request)">
                    <span class="spinner" x-show="busyId === request.id" x-cloak aria-hidden="true"></span>
                    Reject request
                  </button>
                  <button type="button" class="btn btn-ghost" @click="cancelReject()">Cancel</button>
                </div>
              </div>
            </article>
          </template>
        </div>
      </section>

      <!-- Queues not built yet -->
      <section class="card flex flex-col items-center gap-2 py-10 text-center" x-show="activeQueue !== 'organizations' && activeQueue !== 'requests'" x-cloak aria-live="polite">
        <h2 class="text-lg font-semibold" x-text="activeLabel"></h2>
        <p class="text-muted">This review queue is coming soon.</p>
      </section>
    </main>
  </body>
</html>
