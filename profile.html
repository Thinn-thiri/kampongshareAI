<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- sets light / dark before anything is drawn (no white flash) -->
    <script src="/js/theme.js"></script>
    <!-- languages: the three dictionaries, then js/i18n.js sets <html lang> and translates before drawing -->
    <script src="/js/i18n/en.js"></script>
    <script src="/js/i18n/zh.js"></script>
    <script src="/js/i18n/ms.js"></script>
    <script src="/js/i18n.js"></script>
    <title data-i18n="profile.pageTitle">My profile · KampongShare</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Lexend:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/messaging.js"></script>
    <script src="/js/volunteer-options.js"></script>
    <script src="/js/profile-page.js"></script>
    <script src="/js/chat-questions.js"></script>
    <script src="/js/chat.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  </head>
  <body data-require="login">
    <a href="#main" class="skip-link" data-i18n="nav.skip">Skip to main content</a>
    <header class="topbar" x-data="topBar">
      <div class="container-page flex min-h-16 items-center gap-2 py-2">
        <a href="/" class="flex min-h-11 items-center gap-2 rounded-sm font-bold text-primary" aria-label="KampongShare home" data-i18n-attr="aria-label:nav.homeLink">
          <img src="/img/favicon.svg" alt="" class="size-8" />
          <span class="hidden sm:inline" translate="no">KampongShare</span>
        </a>
        <!-- pushes the links and buttons to the right -->
        <span class="flex-1" aria-hidden="true"></span>
        <!-- Desktop links (phones and tablets use the bottom bar) -->
        <nav class="top-track hidden lg:flex" aria-label="Site" data-i18n-attr="aria-label:nav.site" x-show="ready" x-cloak>
          <template x-for="link in topLinks" :key="link.href">
            <a :href="link.href" class="top-link" :aria-current="isCurrent(link.href) ? 'page' : null">
              <span x-text="$t(link.labelKey)"></span>
              <span class="tab-count" x-show="link.badge" x-text="link.badge" :aria-label="$t('nav.waiting', { count: link.badge })"></span>
            </a>
          </template>
        </nav>
        <!-- visitors: Log in · Sign up -->
        <a href="/login.html" class="btn btn-quiet hidden sm:inline-flex" x-show="ready && !profile" x-cloak data-i18n="nav.logIn">Log in</a>
        <a href="/signup.html" class="btn btn-primary px-4" x-show="ready && !profile" x-cloak data-i18n="nav.signUp">Sign up</a>
        <!-- Messages with the unread count (js/messaging.js): individuals and organizations -->
        <a href="/messages.html" class="icon-btn relative" x-show="showMessages" x-cloak
          :aria-current="here('/messages.html') ? 'page' : null" aria-label="Messages"
          :aria-label="unread ? $t('nav.messagesUnread', { count: unread }) : $t('nav.messages')">
          <i class="ph ph-chat-circle" aria-hidden="true"></i>
          <span class="nav-count" x-show="unread" x-cloak x-text="unread > 99 ? '99+' : unread" aria-hidden="true"></span>
        </a>
        <!-- Avatar menu (logged in) or settings menu (visitors): theme, language, profile, switch, log out -->
        <div class="relative" x-data="accountMenu" @keydown.escape="close(true)" @click.outside="close(false)">
          <button type="button" x-ref="menuButton" class="icon-btn gap-1" :class="profile ? '' : 'w-auto px-3'" :aria-label="buttonLabel"
            aria-label="Settings · Language / 语言 / Bahasa" aria-haspopup="menu" :aria-expanded="open.toString()" aria-controls="account-menu" @click="toggle()">
            <span class="avatar" x-show="profile" x-cloak x-text="initial" aria-hidden="true"></span>
            <i class="ph ph-gear-six" x-show="!profile" aria-hidden="true"></i>
            <span class="text-sm font-bold" x-show="!profile" :lang="language.htmlLang" x-text="language.short" aria-hidden="true"></span>
          </button>
          <div id="account-menu" class="menu w-64" role="menu" :aria-label="buttonLabel" x-show="open" x-cloak
            @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)" @keydown.home.prevent="moveTo(0)" @keydown.end.prevent="moveTo(-1)">
            <template x-if="profile">
              <div role="none">
                <p class="menu-heading font-bold break-words text-ink" aria-hidden="true" x-text="profile.full_name"></p>
                <div role="group" :aria-label="profile.full_name">
                  <a :href="dashboard" class="menu-item" role="menuitem" x-show="!canSwitch"><i class="ph ph-squares-four" aria-hidden="true"></i><span data-i18n="nav.myDashboard">My dashboard</span></a>
                  <a href="/donor.html" class="menu-item" role="menuitem" x-show="canSwitch" :aria-current="here('/donor.html') ? 'page' : null"><i class="ph ph-hand-heart" aria-hidden="true"></i><span data-i18n="nav.donating">Donating</span></a>
                  <a href="/volunteer.html" class="menu-item" role="menuitem" x-show="canSwitch" :aria-current="here('/volunteer.html') ? 'page' : null"><i class="ph ph-users" aria-hidden="true"></i><span data-i18n="nav.volunteering">Volunteering</span></a>
                  <a href="/profile.html" class="menu-item" role="menuitem" :aria-current="here('/profile.html') ? 'page' : null"><i class="ph ph-user" aria-hidden="true"></i><span data-i18n="nav.myProfile">My profile</span></a>
                </div>
                <div class="menu-separator" role="separator"></div>
              </div>
            </template>
            <p class="menu-heading" aria-hidden="true" data-i18n="theme.menu">Theme</p>
            <div role="group" aria-label="Theme" data-i18n-attr="aria-label:theme.menu">
              <template x-for="option in themeOptions" :key="option.value">
                <button type="button" class="menu-item" role="menuitemradio" :aria-checked="(theme === option.value).toString()" @click="pickTheme(option.value)">
                  <i :class="option.icon" aria-hidden="true"></i>
                  <span class="flex-1" x-text="$t(`theme.${option.value}`)"></span>
                  <i class="ph ph-check text-primary" x-show="theme === option.value" aria-hidden="true"></i>
                </button>
              </template>
            </div>
            <div class="menu-separator" role="separator"></div>
            <p class="menu-heading" aria-hidden="true">Language / 语言 / Bahasa</p>
            <div role="group" aria-label="Language / 语言 / Bahasa">
              <template x-for="option in languages" :key="option.code">
                <button type="button" class="menu-item" role="menuitemradio" :lang="option.htmlLang" :aria-checked="(lang === option.code).toString()" @click="pickLang(option.code)">
                  <i class="ph ph-globe" aria-hidden="true"></i>
                  <span class="flex-1" x-text="option.name"></span>
                  <i class="ph ph-check text-primary" x-show="lang === option.code" aria-hidden="true"></i>
                </button>
              </template>
            </div>
            <template x-if="profile">
              <div role="none">
                <div class="menu-separator" role="separator"></div>
                <button type="button" class="menu-item" role="menuitem" @click="logout()"><i class="ph ph-sign-out" aria-hidden="true"></i><span data-i18n="nav.logOut">Log out</span></button>
              </div>
            </template>
          </div>
        </div>
      </div>
      <nav class="bottom-nav" aria-label="Main" data-i18n-attr="aria-label:nav.main" x-show="ready" x-cloak>
        <template x-for="link in bottomLinks" :key="link.href">
          <a :href="link.href" class="bottom-nav-link" :aria-current="isCurrent(link.href) ? 'page' : null">
            <i :class="link.icon" aria-hidden="true"></i>
            <span x-text="$t(link.labelKey)"></span>
          </a>
        </template>
      </nav>
    </header>

    <main id="main" tabindex="-1" class="white-fields container-page py-8 focus:outline-none" x-data="profilePage">
      <div class="mx-auto max-w-2xl space-y-6">
        <div>
          <h1 class="title" data-i18n="profile.title">My profile</h1>
          <p class="mt-1 text-muted" data-i18n="profile.intro">Everything we hold about you. You can correct it at any time.</p>
        </div>

        <div class="card space-y-3" x-show="loading" role="status"><span class="sr-only" data-i18n="profile.loading">Loading your profile…</span>
          <div class="skeleton h-5 w-1/3"></div><div class="skeleton h-11 w-full"></div><div class="skeleton h-11 w-full"></div>
        </div>
        <div class="empty" x-show="!loading && loadError" x-cloak role="alert">
          <p class="text-danger" x-text="loadError"></p>
          <button type="button" class="btn btn-secondary mt-3" @click="location.reload()" data-i18n="common.tryAgain">Try again</button>
        </div>

        <template x-if="!loading && form && profile">
          <div class="space-y-6">
            <!-- Add the other role to this account (single-role individuals) -->
            <section class="card flex flex-col gap-3 bg-primary-soft sm:flex-row sm:items-center sm:justify-between"
              x-show="missingRole" aria-labelledby="add-role-heading">
              <div>
                <h2 id="add-role-heading" class="card-title text-ink" x-text="missingRole === 'volunteer' ? $t('profile.wantVolunteer') : $t('profile.wantDonate')"></h2>
                <p class="text-sm text-ink" x-text="missingRole === 'volunteer'
                  ? $t('profile.addVolunteerText')
                  : $t('profile.addDonateText')"></p>
              </div>
              <button type="button" class="btn btn-primary shrink-0" :disabled="addingRole" @click="addRole()">
                <span class="spinner" x-show="addingRole" x-cloak aria-hidden="true"></span>
                <span x-text="missingRole === 'volunteer' ? $t('profile.addVolunteering') : $t('profile.addDonating')"></span>
              </button>
            </section>

            <!-- Just added: what to do next -->
            <div class="rounded-md border border-primary bg-primary-soft p-4 text-sm text-primary" x-show="justAdded" x-cloak role="status">
              <p class="font-bold" x-text="justAdded === 'volunteer' ? $t('profile.volunteeringOn') : $t('profile.donatingOn')"></p>
              <p class="mt-1 text-ink" x-show="justAdded === 'volunteer'"><span data-i18n="profile.addedVolunteerHelp">Add when you're free and what you enjoy below, then press Save changes. An admin will approve your volunteer account before you can apply to events — you can already browse them.</span> <span data-i18n="profile.switchHelp">You can switch between donating and volunteering in the top bar.</span></p>
              <p class="mt-1 text-ink" x-show="justAdded === 'donor'" data-i18n="profile.switchHelp">You can switch between donating and volunteering in the top bar.</p>
              <a class="btn btn-secondary mt-3" :href="justAdded === 'volunteer' ? '/volunteer.html' : '/donor.html'"
                x-text="justAdded === 'volunteer' ? $t('profile.goVolunteer') : $t('profile.goDonor')"></a>
            </div>

            <form class="space-y-6" novalidate @submit.prevent="save">
              <!-- 1. Details -->
              <section class="card space-y-6" aria-labelledby="details-heading">
                <h2 id="details-heading" class="card-title" data-i18n="profile.yourDetails">Your details</h2>
                <div>
                  <label for="pf-name" class="label"><span data-i18n="profile.fullName">Full name</span></label>
                  <input id="pf-name" class="input" type="text" autocomplete="name" maxlength="100" required x-model="form.fullName"
                    :aria-invalid="errors.fullName ? 'true' : null" aria-describedby="err-pf-name" />
                  <p id="err-pf-name" class="field-error" x-show="errors.fullName" x-text="errors.fullName"></p>
                </div>
                <div>
                  <label for="pf-email" class="label" data-i18n="field.email">Email</label>
                  <input id="pf-email" class="input" type="email" :value="email" readonly aria-describedby="help-pf-email" />
                  <p id="help-pf-email" class="helper-text" data-i18n="profile.emailHelp">Used to log in. It can't be changed here yet.</p>
                </div>
                <div>
                  <label for="pf-phone" class="label"><span data-i18n="field.phone">Phone</span> <span class="optional" data-i18n="common.optional">(optional)</span></label>
                  <input id="pf-phone" class="input" type="tel" inputmode="tel" autocomplete="tel-national" x-model="form.phone" placeholder="e.g. 9123 4567" data-i18n-attr="placeholder:field.phonePlaceholder"
                    :aria-invalid="errors.phone ? 'true' : null" aria-describedby="help-pf-phone err-pf-phone" />
                  <p id="help-pf-phone" class="helper-text" data-i18n="profile.phoneHelp">Only shown to organizations you give to or volunteer with, and to admins.</p>
                  <p id="err-pf-phone" class="field-error" x-show="errors.phone" x-text="errors.phone"></p>
                </div>
                <div class="space-y-6">
                  <div>
                    <label for="pf-postal" class="label"><span data-i18n="field.postalCode">Postal code</span> <span class="optional" data-i18n="common.optional">(optional)</span></label>
                    <input id="pf-postal" class="input" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="6" x-model="form.postalCode" placeholder="e.g. 520123" data-i18n-attr="placeholder:field.postalPlaceholder"
                      :aria-invalid="errors.postalCode ? 'true' : null" aria-describedby="help-pf-postal err-pf-postal" />
                    <p id="help-pf-postal" class="helper-text" data-i18n="profile.postalHelp">Only used to show needs near you. We never ask for your full address.</p>
                    <p id="err-pf-postal" class="field-error" x-show="errors.postalCode" x-text="errors.postalCode"></p>
                  </div>
                  <div>
                    <label for="pf-area" class="label"><span data-i18n="field.area">Area</span> <span class="optional" data-i18n="common.optional">(optional)</span></label>
                    <input id="pf-area" class="input" type="text" list="sg-areas" maxlength="50" x-model="form.area" placeholder="e.g. Tampines" data-i18n-attr="placeholder:field.areaPlaceholder"
                      :aria-invalid="errors.area ? 'true' : null" aria-describedby="err-pf-area" />
                    <p id="err-pf-area" class="field-error" x-show="errors.area" x-text="errors.area"></p>
                  </div>
                </div>
              </section>

              <!-- 2. Donate / volunteer (individual accounts only) -->
              <fieldset class="card space-y-3" x-show="isIndividual" aria-describedby="help-pf-roles err-pf-roles">
                <legend class="sr-only" data-i18n="profile.whatToDo">What would you like to do?</legend>
                <h2 class="card-title" data-i18n="profile.whatToDo">What would you like to do?</h2>
                <p id="help-pf-roles" class="helper-text mt-0" data-i18n="profile.keepOne">Keep at least one turned on.</p>
                <div class="grid gap-3 sm:grid-cols-2">
                  <label class="choice-card">
                    <input id="pf-donate" type="checkbox" class="mt-1 size-4 accent-primary" x-model="form.isDonor" @change="errors = { ...errors, roles: undefined }" />
                    <span>
                      <span class="block font-bold" data-i18n="profile.donate">Donate</span>
                      <span class="block text-sm text-muted" data-i18n="profile.donateHelp">Offer items to organizations.</span>
                    </span>
                  </label>
                  <label class="choice-card">
                    <input type="checkbox" class="mt-1 size-4 accent-primary" x-model="form.isVolunteer" @change="onVolunteerToggle()" />
                    <span>
                      <span class="block font-bold" data-i18n="profile.volunteer">Volunteer</span>
                      <span class="block text-sm text-muted" data-i18n="profile.volunteerHelp">Apply to help at events.</span>
                    </span>
                  </label>
                </div>
                <p id="err-pf-roles" class="field-error" x-show="errors.roles" x-text="errors.roles"></p>
              </fieldset>
              <p class="card text-sm text-muted" x-show="!isIndividual" data-i18n="profile.staffNoRoles">Organization and admin accounts can't donate or volunteer.</p>

              <!-- 3. Volunteering -->
              <section id="volunteer-section" class="card scroll-mt-24 space-y-6" x-show="isIndividual && form.isVolunteer" aria-labelledby="vol-heading">
                <div>
                  <div class="flex flex-wrap items-center gap-2">
                    <h2 id="vol-heading" class="card-title" data-i18n="profile.volunteering">Volunteering</h2>
                    <span :class="volunteerStatus?.className" x-show="volunteerStatus" x-text="volunteerStatus?.label"></span>
                  </div>
                  <p class="helper-text" data-i18n="profile.volunteeringHelp">Tell organizations when you're free and what you enjoy. All optional.</p>
                </div>
                <p class="note-warning" x-show="profile.is_volunteer && profile.volunteer_approval !== 'approved' && profile.volunteer_approval !== 'rejected'" data-i18n="profile.approvalHelp">
                  An admin checks every volunteer account first. You can browse events now and apply once you're approved.
                </p>
                <div class="space-y-2 rounded-md border border-danger bg-danger-soft p-3 text-sm text-danger" x-show="profile.volunteer_approval === 'rejected'">
                  <p class="font-bold" data-i18n="profile.adminNote">Note from the admin</p>
                  <p class="whitespace-pre-line text-ink" x-text="profile.volunteer_note || $t('orgDash.noReason')"></p>
                  <button type="button" class="btn btn-secondary" :disabled="reviewBusy" @click="askForReview()">
                    <span class="spinner" x-show="reviewBusy" x-cloak aria-hidden="true"></span>
                    <span data-i18n="profile.askReview">Ask for review again</span>
                  </button>
                </div>
                <fieldset>
                  <legend class="label"><span data-i18n="signup.days">Days you're usually free</span> <span class="optional" data-i18n="common.optional">(optional)</span></legend>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="option in dayOptions" :key="option.value">
                      <label class="check-pill"><input type="checkbox" class="size-4 accent-primary" :value="option.value" x-model="form.days" /><span x-text="option.label"></span></label>
                    </template>
                  </div>
                </fieldset>
                <fieldset>
                  <legend class="label"><span data-i18n="signup.times">Times of day</span> <span class="optional" data-i18n="common.optional">(optional)</span></legend>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="option in timeOptions" :key="option.value">
                      <label class="check-pill"><input type="checkbox" class="size-4 accent-primary" :value="option.value" x-model="form.times" /><span x-text="option.label"></span></label>
                    </template>
                  </div>
                </fieldset>
                <fieldset>
                  <legend class="label"><span data-i18n="field.interests">Interests</span> <span class="optional" data-i18n="common.optional">(optional)</span></legend>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="option in interestOptions" :key="option.value">
                      <label class="check-pill"><input type="checkbox" class="size-4 accent-primary" :value="option.value" x-model="form.interests" /><span x-text="option.label"></span></label>
                    </template>
                  </div>
                </fieldset>
                <fieldset>
                  <legend class="label"><span data-i18n="field.skills">Skills</span> <span class="optional" data-i18n="common.optional">(optional)</span></legend>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="option in skillOptions" :key="option.value">
                      <label class="check-pill"><input type="checkbox" class="size-4 accent-primary" :value="option.value" x-model="form.skills" /><span x-text="option.label"></span></label>
                    </template>
                  </div>
                </fieldset>
                <label class="flex items-start gap-3 text-sm">
                  <input type="checkbox" class="mt-1 size-5 shrink-0 accent-primary" x-model="form.matchingOptIn" />
                  <span>
                    <span data-i18n="signup.matching">Use my availability, interests and skills to recommend volunteer events.</span>
                    <span class="block text-muted" data-i18n="profile.matchingHelp">Optional. If unticked, we won't use these details for AI suggestions.</span>
                  </span>
                </label>
              </section>

              <div role="alert">
                <p class="note-danger" x-show="formError" x-text="formError"></p>
              </div>
              <button type="submit" class="btn btn-primary w-full sm:w-auto" :disabled="saving">
                <span class="spinner" x-show="saving" x-cloak aria-hidden="true"></span>
                <span x-text="saving ? $t('common.saving') : $t('common.saveChanges')">Save changes</span>
              </button>
            </form>

            <!-- Password: choose a new one (the email link on "Forgot password?" is for people who can't log in) -->
            <form class="card space-y-4" novalidate x-data="changePassword" @submit.prevent="submit" aria-labelledby="password-heading">
              <div>
                <h2 id="password-heading" class="card-title" data-i18n="profile.passwordTitle">Password</h2>
                <p class="mt-1 text-sm text-muted" data-i18n="profile.passwordIntro">Choose a new password for logging in.</p>
              </div>
              <div>
                <label for="pf-new-password" class="label" data-i18n="reset.password">New password</label>
                <div class="password-field" x-data="passwordToggle">
                  <input id="pf-new-password" class="input" type="password" :type="shown ? 'text' : 'password'" x-ref="input" autocomplete="new-password" x-model="password"
                    :aria-invalid="errors.password ? 'true' : null" aria-describedby="pf-new-password-help pf-new-password-err" />
                  <button type="button" class="password-toggle" @mousedown.prevent @click="toggle($event)" aria-controls="pf-new-password"
                    aria-label="Show password" :aria-label="shown ? $t('ui.hidePassword') : $t('ui.showPassword')" :aria-pressed="shown ? 'true' : 'false'">
                    <span x-show="!shown"><i class="ph ph-eye size-5" aria-hidden="true"></i></span>
                    <span x-show="shown" x-cloak><i class="ph ph-eye-slash size-5" aria-hidden="true"></i></span>
                  </button>
                </div>
                <p id="pf-new-password-help" class="helper-text" data-i18n="reset.help">At least 8 characters.</p>
                <p id="pf-new-password-err" class="field-error" x-show="errors.password" x-text="errors.password"></p>
              </div>
              <div>
                <label for="pf-confirm-password" class="label" data-i18n="reset.confirm">Confirm new password</label>
                <div class="password-field" x-data="passwordToggle">
                  <input id="pf-confirm-password" class="input" type="password" :type="shown ? 'text' : 'password'" x-ref="input" autocomplete="new-password" x-model="confirm"
                    :aria-invalid="errors.confirm ? 'true' : null" aria-describedby="pf-confirm-password-err" />
                  <button type="button" class="password-toggle" @mousedown.prevent @click="toggle($event)" aria-controls="pf-confirm-password"
                    aria-label="Show password" :aria-label="shown ? $t('ui.hidePassword') : $t('ui.showPassword')" :aria-pressed="shown ? 'true' : 'false'">
                    <span x-show="!shown"><i class="ph ph-eye size-5" aria-hidden="true"></i></span>
                    <span x-show="shown" x-cloak><i class="ph ph-eye-slash size-5" aria-hidden="true"></i></span>
                  </button>
                </div>
                <p id="pf-confirm-password-err" class="field-error" x-show="errors.confirm" x-text="errors.confirm"></p>
              </div>
              <div role="alert">
                <p class="note-danger" x-show="error" x-text="error"></p>
              </div>
              <button type="submit" class="btn btn-secondary w-full sm:w-auto" :disabled="busy">
                <span class="spinner" x-show="busy" x-cloak aria-hidden="true"></span>
                <span x-text="busy ? $t('reset.busy') : $t('reset.submit')">Save new password</span>
              </button>
            </form>

            <!-- 4. Consent (REQUIREMENTS.md 4.2) -->
            <section class="card space-y-3" aria-labelledby="consent-heading">
              <h2 id="consent-heading" class="card-title" data-i18n="profile.privacyTitle">Privacy &amp; consent</h2>
              <template x-if="hasConsent">
                <div class="space-y-3">
                  <p class="text-sm">
                    <span class="badge badge-success" data-i18n="profile.consentGiven">Consent given</span>
                    <span class="ml-1 text-muted" x-text="$t('profile.agreedOn', { date: formatDate(profile.consented_at, true) })"></span>
                  </p>
                  <p class="text-sm text-muted" data-i18n="profile.withdrawHelp">You can withdraw it at any time. You won't be able to donate or volunteer until you agree again.</p>
                  <button type="button" class="btn btn-danger" :disabled="consentBusy" @click="confirmWithdrawConsent()">
                    <span class="spinner" x-show="consentBusy" x-cloak aria-hidden="true"></span>
                    <span data-i18n="profile.withdrawConsent">Withdraw my consent</span>
                  </button>
                </div>
              </template>
              <template x-if="!hasConsent">
                <div class="space-y-3 rounded-md bg-warning-soft p-4">
                  <p class="text-sm font-bold text-warning" data-i18n="profile.needConsent">You need to give consent before you can donate or volunteer.</p>
                  <label class="flex items-start gap-3 text-sm">
                    <input type="checkbox" class="mt-1 size-5 shrink-0 accent-primary" x-model="consentChecked" />
                    <span><span data-i18n="signup.consentBefore">I agree to the</span> <a href="/privacy.html" target="_blank" rel="noopener" class="font-bold text-primary underline" data-i18n="signup.consentLink">Privacy Notice</a> <span data-i18n="signup.consentAfter">and to KampongShare using my details to coordinate donations and volunteering.</span></span>
                  </label>
                  <label class="flex items-start gap-3 text-sm">
                    <input type="checkbox" class="mt-1 size-5 shrink-0 accent-primary" x-model="ageChecked" />
                    <span data-i18n="signup.age">I confirm I am 18 or older.</span>
                  </label>
                  <button type="button" class="btn btn-primary" :disabled="consentBusy || !consentChecked || !ageChecked" @click="submitConsent()">
                    <span class="spinner" x-show="consentBusy" x-cloak aria-hidden="true"></span>
                    <span data-i18n="profile.giveConsent">Give consent</span>
                  </button>
                </div>
              </template>
            </section>

            <!-- 5. Your data (REQUIREMENTS.md 4.4) -->
            <section class="card space-y-3" aria-labelledby="data-heading">
              <h2 id="data-heading" class="card-title" data-i18n="profile.yourData">Your data</h2>
              <dl class="grid gap-x-4 gap-y-2 text-sm sm:grid-cols-[max-content_1fr]">
                <dt class=" text-muted" data-i18n="profile.account">Account</dt>
                <dd x-text="roleLabel(profile.role)"></dd>
                <dt class=" text-muted" data-i18n="field.email">Email</dt>
                <dd class="break-words" x-text="email || '—'"></dd>
                <dt class=" text-muted" data-i18n="profile.memberSince">Member since</dt>
                <dd x-text="formatDate(profile.created_at)"></dd>
                <dt class=" text-muted" data-i18n="profile.consent">Consent</dt>
                <dd x-text="profile.consented_at ? $t('profile.givenOn', { date: formatDate(profile.consented_at, true) }) : $t('common.notGiven')"></dd>
                <dt class=" text-muted" data-i18n="profile.adult">18 or older</dt>
                <dd x-text="profile.age_confirmed ? $t('profile.confirmed') : $t('profile.notConfirmed')"></dd>
                <dt class=" text-muted" x-show="volunteerStatus" data-i18n="profile.volunteerAccount">Volunteer account</dt>
                <dd x-show="volunteerStatus" x-text="volunteerStatus?.label"></dd>
                <dt class=" text-muted" x-show="isIndividual" data-i18n="profile.aiMatching">AI matching</dt>
                <dd x-show="isIndividual" x-text="profile.matching_opt_in ? $t('profile.matchingOn') : $t('profile.matchingOff')"></dd>
              </dl>
              <p class="text-sm text-muted"><span data-i18n="profile.readHow">Read how we use it in the</span> <a href="/privacy.html" class="font-bold text-primary underline" data-i18n="common.privacyNotice">Privacy Notice</a><span data-i18n="match.noMatchAfter">.</span></p>
            </section>

            <!-- 6. Delete account (REQUIREMENTS.md 4.4) -->
            <section class="card space-y-3" aria-labelledby="delete-heading">
              <h2 id="delete-heading" class="card-title" data-i18n="profile.deleteTitle">Delete my account</h2>
              <template x-if="isIndividual">
                <div class="space-y-3">
                  <p class="text-sm text-muted" data-i18n="profile.deleteHelp">
                    This removes your login, profile, contact details and volunteer applications. Waiting offers are cancelled.
                    Past donations stay with the organizations for their records, but without your name or contact details.
                  </p>
                  <label class="flex items-start gap-3 text-sm">
                    <input id="delete-understood" type="checkbox" class="mt-1 size-5 shrink-0 accent-primary" x-model="deleteUnderstood"
                      :aria-invalid="deleteError && !deleteUnderstood ? 'true' : null" aria-describedby="delete-error" />
                    <span data-i18n="profile.deleteUnderstand">I understand this can't be undone.</span>
                  </label>
                  <p id="delete-error" class="field-error" x-show="deleteError" x-text="deleteError" role="alert"></p>
                  <button type="button" class="btn btn-danger" :disabled="deleting" @click="deleteAccount()">
                    <span class="spinner" x-show="deleting" x-cloak aria-hidden="true"></span>
                    <span x-text="deleting ? $t('profile.deleting') : $t('profile.deleteTitle')" data-i18n="profile.deleteTitle">Delete my account</span>
                  </button>
                </div>
              </template>
              <p class="text-sm text-muted" x-show="!isIndividual" data-i18n="profile.staffNoDelete">
                Organization and admin accounts own public records, so they can't be deleted here. Please contact the KampongShare team.
              </p>
            </section>
          </div>
        </template>
      </div>

      <datalist id="sg-areas">
        <option value="Ang Mo Kio"></option><option value="Bedok"></option><option value="Bishan"></option>
        <option value="Bukit Batok"></option><option value="Bukit Merah"></option><option value="Bukit Panjang"></option>
        <option value="Bukit Timah"></option><option value="Choa Chu Kang"></option><option value="Clementi"></option>
        <option value="Geylang"></option><option value="Hougang"></option><option value="Jurong East"></option>
        <option value="Jurong West"></option><option value="Kallang"></option><option value="Pasir Ris"></option>
        <option value="Punggol"></option><option value="Queenstown"></option><option value="Sembawang"></option>
        <option value="Sengkang"></option><option value="Serangoon"></option><option value="Tampines"></option>
        <option value="Toa Payoh"></option><option value="Woodlands"></option><option value="Yishun"></option>
      </datalist>
    </main>
  </body>
</html>
